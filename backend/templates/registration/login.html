<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Daily Project Planner</title>
<style>
:root{font:16px/1.5 system-ui;color:#253a36;background:#f4f6f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{background:white;border:1px solid #dce3dd;border-radius:8px;width:100%;max-width:420px;padding:32px}h1{font-size:24px;margin:0 0 8px}p{color:#4b6255}label{display:block;margin:16px 0 4px}input,button{font:inherit;width:100%;padding:12px;border:1px solid #657b6b;border-radius:6px}button{margin-top:24px;background:#28634e;color:white;cursor:pointer}.secondary{background:white;color:#253a36}input:focus-visible,button:focus-visible{outline:3px solid #28634e;outline-offset:3px}.errorlist,[role=alert]{color:#a52626;padding-left:0;list-style:none}footer{font-size:12px;margin-top:24px;color:#4b6255}
</style></head><body><main><h1>Daily Project Planner</h1><p>Sign in to your workspace.</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}<label for="id_login">Username</label><input id="id_login" name="login" autocomplete="username" required autofocus value="{{ form.login.value|default:'' }}">{{ form.login.errors }}<label for="id_password">Password</label><input id="id_password" type="password" name="password" autocomplete="current-password" required>{{ form.password.errors }}<input type="hidden" name="next" value="{{ redirect_field_value|default:'/app/' }}"><button type="submit">Sign in</button></form>
{% if entra_enabled %}<form method="post" action="/accounts/oidc/entra/login/">{% csrf_token %}<button class="secondary" type="submit">Sign in with Microsoft</button></form>{% endif %}
<footer>Your project records stay on your organisation’s server.</footer></main></body></html>
